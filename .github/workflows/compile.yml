name: Compilar Proyecto Pico

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar codigo
      uses: actions/checkout@v4

    - name: Instalar herramientas
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib python3

    - name: Descargar SDK de forma recursiva
      run: |
        export PICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk
        # CORREGIDO: URL completa y correcta del SDK oficial de Raspberry Pi
        git clone --depth 1 --branch master https://github.com $PICO_SDK_PATH
        cd $PICO_SDK_PATH
        git submodule update --init --recursive

    - name: Compilar Transmisor
      run: |
        export PICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk
        mkdir build && cd build
        
        # Prepara la configuración global indicando que es para la Raspberry Pi Pico
        cmake -DPICO_BOARD=pico -DPICO_SDK_PATH=$PICO_SDK_PATH ..
        
        # Entra a la carpeta del transmisor y compila únicamente este proyecto
        cd 18_transmitter
        make
        
    - name: Guardar binario .uf2
      uses: actions/upload-artifact@v4
      with:
        name: ejecutable-transmisor
        path: build/18_transmitter/**/*.uf2
