name: Compilar Transmisor Pico

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar codigo
      uses: actions/checkout@v4

    - name: Instalar herramientas
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib python3

    - name: Configurar SDK de Pico
      run: |
        git clone --depth 1 --branch master https://github.com /home/runner/pico-sdk
        cd /home/runner/pico-sdk
        git submodule update --init --recursive

    - name: Compilar Transmisor
      run: |
        export PICO_SDK_PATH=/home/runner/pico-sdk
        mkdir build && cd build
        cmake -DPICO_BOARD=pico ..
        cd 18_transmitter
        make
        
    - name: Guardar binario .uf2
      uses: actions/upload-artifact@v4
      with:
        name: ejecutable-transmisor
        path: build/18_transmitter/**/*.uf2
