name: Compilar Proyecto Pico

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar codigo
      uses: actions/checkout@v4

    - name: Instalar herramientas
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib python3

    - name: Descargar SDK de forma recursiva
      run: |
        export PICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk
        git clone --depth 1 --branch master https://github.com $PICO_SDK_PATH
        cd $PICO_SDK_PATH
        git submodule update --init --recursive

    - name: Compilar Transmisor
      run: |
        export PICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk
        mkdir build && cd build
        
        # Prepara la configuración global desde la raíz
        cmake ..
        
        # Entra y compila EN EXCLUSIVA la carpeta del transmisor
        cd 18_transmitter
        make
        
    - name: Descargar mi archivo .uf2
      uses: actions/upload-artifact@v4
      with:
        name: pico-transmisor-uf2
        path: build/18_transmitter/**/*.uf2
